<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الأسماء</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🏛️ توزيع المدعوين — Kempinski</h1><a href="index.html" class="on">تسجيل الأسماء</a><a href="search.html" >بحث عن مدعو</a></header>
<main>
<p class="hint">اضغط على أي طاولة لإضافة أسماء المدعوين. <span class="legend"><span><i style="background:#10b981"></i>طاولة بها أسماء</span><span>الرقم الأخضر = عدد المسجلين</span></span></p>
<div class="plan" id="plan"></div>
</main>
<div class="modal" id="modal"><div class="box">
 <h2 id="mt"></h2><div class="sub" id="ms"></div>
 <form class="row" id="f"><input type="text" id="nm" placeholder="اسم المدعو" autocomplete="off" required><button>إضافة</button></form>
 <div class="full" id="full"></div>
 <ul class="names" id="list"></ul>
 <button class="gray" id="close">إغلاق</button>
</div></div>
<script src="common.js"></script>
<script>
let guests={}, cur=null;
const modal=document.getElementById('modal'),list=document.getElementById('list'),nm=document.getElementById('nm');
function render(){drawPlan(document.getElementById('plan'),{onClick:open,guests});}
function open(t){cur=t;refresh();modal.classList.add('open');nm.value='';nm.focus();}
function refresh(){
  const a=guests[cur]||[],cap=capacityOf(cur);
  document.getElementById('mt').textContent='طاولة رقم '+cur;
  document.getElementById('ms').textContent='سعة الطاولة: '+cap+' • المسجلون: '+a.length;
  document.getElementById('full').textContent=a.length>=cap?'تنبيه: عدد المسجلين وصل لسعة الطاولة (يمكنك الإضافة مع ذلك)':'';
  list.innerHTML='';
  a.forEach((n,i)=>{const li=document.createElement('li');const s=document.createElement('span');s.textContent=(i+1)+'. '+n;
    const b=document.createElement('button');b.className='del';b.textContent='حذف';
    b.onclick=async()=>{if(confirm('حذف "'+n+'" ؟')){guests=await api('DELETE',{table:cur,index:i});refresh();render();}};
    li.append(s,b);list.appendChild(li);});
}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
  const v=nm.value.trim();if(!v)return;
  try{guests=await api('POST',{table:cur,name:v});}catch(err){alert(err.message);return;}
  nm.value='';nm.focus();refresh();render();};
document.getElementById('close').onclick=()=>modal.classList.remove('open');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
api('GET').then(g=>{guests=g;render();});
</script></body></html>
