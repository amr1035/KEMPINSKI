<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكان الطاولة</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🏛️ توزيع المدعوين — Kempinski</h1><a href="index.html" >تسجيل الأسماء</a><a href="search.html" class="on">بحث عن مدعو</a></header>
<main>
<p><a href="search.html" style="color:#2563eb">← رجوع للبحث</a></p>
<div class="big" id="t"></div><div class="sub" id="s"></div>
<div class="plan" id="plan"></div>
</main>
<script src="common.js"></script>
<script>
const p=new URLSearchParams(location.search),t=+p.get('table'),name=p.get('name')||'';
document.getElementById('t').textContent=(name?name+' — ':'')+'طاولة رقم '+t;
api('GET').then(g=>{
  document.getElementById('s').textContent='على نفس الطاولة: '+((g[t]||[]).join('، ')||'—');
  drawPlan(document.getElementById('plan'),{highlight:t});
});
</script></body></html>
